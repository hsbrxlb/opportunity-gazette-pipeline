name: Collect public opportunity candidates

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: Optional Asia/Shanghai target date (YYYY-MM-DD)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: opportunity-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Collect public signals
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then
            python src/collect.py --date "${{ inputs.target_date }}"
          else
            python src/collect.py
          fi
      - name: Validate public output
        run: |
          python scripts/validate.py
          python scripts/scan_public.py
      - name: Persist candidate data
        run: |
          git config user.name "opportunity-gazette-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidates status
          if git diff --cached --quiet; then
            echo "Candidate data is already current."
            exit 0
          fi
          target_date="$(python -c 'import json; print(json.load(open("status/latest.json"))["targetDate"])')"
          git commit -m "Collect opportunity candidates ${target_date}"
          git push origin HEAD:main
